[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vet-case-extractor"
version = "1.0.0"
description = "Structured Chinese veterinary clinical case report & scanned textbook extraction toolchain with provenance and QA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "vet-case-extractor contributors" }
]
dependencies = [
  "pymupdf>=1.23.0",
  "openpyxl>=3.1.0",
  "pydantic>=2.6.0",
  "click>=8.1.0",
  "pyyaml>=6.0.0",
  "python-dotenv>=1.0.0",
  "tenacity>=8.2.0",
  "httpx>=0.27.0",
  "psutil>=5.9.0",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
ocr = [
  "rapidocr-onnxruntime>=1.2.3",
  "numpy>=1.26.0",
]
pdfplumber = [
  "pdfplumber>=0.10.0",
]
gemini = [
  "google-genai>=1.0.0",
]
mcp = [
  "mcp>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "fpdf2>=2.7.0",
]
all = [
  "vet-case-extractor[ocr,pdfplumber,gemini,mcp,dev]",
]

[project.scripts]
vetcase = "vet_case_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
